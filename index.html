:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --h:262;--bg:oklch(.965 .014 var(--h));--panel:oklch(.995 .004 var(--h));--ink:oklch(.22 .03 var(--h));--muted:oklch(.5 .04 var(--h));
 --line:oklch(.88 .02 var(--h));--accent:oklch(.55 .2 var(--h));--on-accent:#fff;--field:oklch(.975 .01 var(--h))}
:root[data-accent="blue"]{--h:262}
:root[data-accent="violet"]{--h:295}
:root[data-accent="teal"]{--h:190}
:root[data-accent="green"]{--h:150}
:root[data-accent="orange"]{--h:55}
:root[data-accent="pink"]{--h:355}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:oklch(.17 .035 var(--h));--panel:oklch(.22 .04 var(--h));--ink:oklch(.95 .01 var(--h));--muted:oklch(.72 .04 var(--h));--line:oklch(.32 .05 var(--h));--accent:oklch(.72 .16 var(--h));--on-accent:oklch(.18 .04 var(--h));--field:oklch(.19 .035 var(--h))}}
:root[data-theme="dark"]{--bg:oklch(.17 .035 var(--h));--panel:oklch(.22 .04 var(--h));--ink:oklch(.95 .01 var(--h));--muted:oklch(.72 .04 var(--h));--line:oklch(.32 .05 var(--h));--accent:oklch(.72 .16 var(--h));--on-accent:oklch(.18 .04 var(--h));--field:oklch(.19 .035 var(--h))}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
.sb{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:oklch(.22 .05 var(--h));z-index:50;pointer-events:none}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Space Grotesk","Helvetica Neue",Arial,sans-serif;line-height:1.45}
main{max-width:1100px;margin:0 auto;padding:18px 14px 36px;display:grid;gap:16px;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);align-items:start}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr)}}
h1{grid-column:1/-1;margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(30px,6vw,52px);letter-spacing:.01em;line-height:1.05}
.stage,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
canvas{display:block;width:100%;height:auto;border-radius:8px;background:#000;touch-action:none;cursor:grab;user-select:none}
canvas.drag{cursor:grabbing}
.hint,.status{color:var(--muted);font-size:13px;margin:8px 2px 0}
.status{min-height:1.3em}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{font:inherit;font-weight:700;border-radius:9px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:9px 13px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{display:grid;gap:14px}
label{display:grid;gap:5px;font-size:14px;font-weight:700}
label small{font-weight:500;color:var(--muted)}
textarea,select,input[type=file]{font:inherit;width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
textarea{min-height:76px;resize:vertical;font-size:18px;font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:100%;height:38px;padding:2px;border-radius:9px;border:1px solid var(--line);background:var(--field)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:5px 10px;font-size:13px}
.check{display:flex;align-items:center;gap:8px}
.theme{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:14px;font-weight:700}
.theme label{display:flex;align-items:center;gap:8px}
.theme select{width:auto;padding:6px 10px}
fieldset{min-width:0;margin:0;border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:12px}
legend{font-weight:700;padding:0 6px}
.gifopts{align-items:center}
.gifopts label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.gifopts select{width:auto;padding:6px 10px}
</style>
</head>

  var boxes=[all];
  function stat(b){var mn=[31,31,31],mx=[0,0,0],pop=0;for(var k=0;k<b.length;k++){var c=b[k],ch=[c>>10,c>>5&31,c&31];for(var j=0;j<3;j++){if(ch[j]<mn[j])mn[j]=ch[j];if(ch[j]>mx[j])mx[j]=ch[j]}pop+=hist[c]}return{mn:mn,mx:mx,pop:pop}}
  while(boxes.length<n){
   var bi=-1,best=0;
   boxes.forEach(function(b,i){if(b.length>1){var s=stat(b),rg=Math.max(s.mx[0]-s.mn[0],s.mx[1]-s.mn[1],s.mx[2]-s.mn[2]),sc=s.pop*(rg+1);if(sc>best){best=sc;bi=i}}});
   if(bi<0)break;
   var b=boxes[bi],s=stat(b),r=[s.mx[0]-s.mn[0],s.mx[1]-s.mn[1],s.mx[2]-s.mn[2]],ch=r[0]>=r[1]&&r[0]>=r[2]?0:r[1]>=r[2]?1:2,sh=ch===0?10:ch===1?5:0;
   b.sort(function(p,q){return (p>>sh&31)-(q>>sh&31)});
   var half=s.pop/2,acc=0,cut=0;for(;cut<b.length-1;cut++){acc+=hist[b[cut]];if(acc>=half)break}
   cut=Math.max(0,Math.min(b.length-2,cut));
   boxes.splice(bi,1,b.slice(0,cut+1),b.slice(cut+1));
  }
  var pal=new Uint8Array(768);
  boxes.forEach(function(b,i){var R=0,G=0,B=0,P=0;b.forEach(function(c){var h=hist[c];R+=(c>>10)*h;G+=(c>>5&31)*h;B+=(c&31)*h;P+=h});function e(v){v=Math.round(v/P);return (v<<3)|(v>>2)}pal[i*3]=e(R);pal[i*3+1]=e(G);pal[i*3+2]=e(B)});
  return pal;
 }
 function lzw(idx,mc){
  var clear=1<<mc,eoi=clear+1,next=eoi+1,size=mc+1,dict=new Map(),out=[],cur=0,nb=0;
  function emit(c){cur|=c<<nb;nb+=size;while(nb>=8){out.push(cur&255);cur>>>=8;nb-=8}}
  emit(clear);var prefix=idx[0];
  for(var i=1;i<idx.length;i++){
   var c=idx[i],key=prefix*256+c,v=dict.get(key);
   if(v!==undefined){prefix=v;continue}
   emit(prefix);
   if(next===4096){emit(clear);dict.clear();next=eoi+1;size=mc+1}
   else{if(next>=(1<<size))size++;dict.set(key,next++)}
   prefix=c;
  }
  emit(prefix);emit(eoi);if(nb>0)out.push(cur&255);
  return out;
 }
 function encodeGif(frames,w,h,delay,pal){
  var o=[],cache=new Int16Array(32768).fill(-1);
  function w16(v){o.push(v&255,v>>8&255)}
  function near(c){var r=c>>10,g=c>>5&31,b=c&31,bi=0,bd=1e9;for(var i=0;i<256;i++){var dr=(pal[i*3]>>3)-r,dg=(pal[i*3+1]>>3)-g,db=(pal[i*3+2]>>3)-b,d=dr*dr*2+dg*dg*3+db*db;if(d<bd){bd=d;bi=i}}return bi}
  'GIF89a'.split('').forEach(function(c){o.push(c.charCodeAt(0))});
  w16(w);w16(h);o.push(0xF7,0,0);for(var i=0;i<768;i++)o.push(pal[i]);
  if(frames.length>1){o.push(0x21,0xFF,0x0B);'NETSCAPE2.0'.split('').forEach(function(c){o.push(c.charCodeAt(0))});o.push(3,1,0,0,0)}
  frames.forEach(function(d){
   o.push(0x21,0xF9,4,0);w16(delay);o.push(0,0);
   o.push(0x2C);w16(0);w16(0);w16(w);w16(h);o.push(0);
   var idx=new Uint8Array(w*h);
   for(var p=0,q=0;p<d.length;p+=4,q++){var c=((d[p]>>3)<<10)|((d[p+1]>>3)<<5)|(d[p+2]>>3),v=cache[c];if(v<0){v=near(c);cache[c]=v}idx[q]=v}
   var bytes=lzw(idx,8);o.push(8);
   for(var s=0;s<bytes.length;s+=255){var n=Math.min(255,bytes.length-s);o.push(n);for(var k=0;k<n;k++)o.push(bytes[s+k])}
   o.push(0);
  });
  o.push(0x3B);return new Uint8Array(o);
 }
 $('gif').addEventListener('click',async function(){
  var btn=$('gif');btn.disabled=true;
  try{
   var tw=+$('gifW').value,anim=$('pulse').checked,N=anim?16:1,th=Math.round(cv.height*tw/cv.width);
   var tmp=document.createElement('canvas');tmp.width=tw;tmp.height=th;var t=tmp.getContext('2d'),frames=[],hist=new Uint32Array(32768);
   for(var f=0;f<N;f++){
    glowScale=anim?.725+.275*Math.cos(6.2831853*f/N):1;draw();
    t.drawImage(cv,0,0,tw,th);var d=t.getImageData(0,0,tw,th).data;frames.push(d);
    for(var i=0;i<d.length;i+=8)hist[((d[i]>>3)<<10)|((d[i+1]>>3)<<5)|(d[i+2]>>3)]++;
    say('Rendering frame '+(f+1)+' of '+N+'…');await new Promise(function(r){setTimeout(r,0)});
   }
   glowScale=1;draw();say('Encoding GIF…');await new Promise(function(r){setTimeout(r,0)});
   var bytes=encodeGif(frames,tw,th,6,medianCut(hist,256));
   var gb=new Blob([bytes],{type:'image/gif'}),gf=new File([gb],'potential-man.gif',{type:'image/gif'});
   if(canShareFile(gf)){pending={b:gb,name:'potential-man.gif'};$('shareNow').hidden=false;say('GIF ready. Tap Share GIF to save it.')}
   else await saveBlob(gb,'potential-man.gif');
  }catch(e){glowScale=1;draw();say('Could not make the GIF. Try a smaller width.')}
  btn.disabled=false;
 });
 (function(){
  var d=document.documentElement,mS=$('mode'),aS=$('accent');
  function syncBars(){try{var c=document.createElement('canvas').getContext('2d');c.fillStyle='#000';c.fillStyle=getComputedStyle(document.body).backgroundColor;c.fillRect(0,0,1,1);var q=c.getImageData(0,0,1,1).data;$('tc').setAttribute('content','#'+[q[0],q[1],q[2]].map(function(v){return ('0'+v.toString(16)).slice(-2)}).join(''))}catch(e){}}
  if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncBars)}catch(e){}
  try{mS.value=localStorage.getItem('gmm-mode')||'system';aS.value=localStorage.getItem('gmm-accent')||'blue'}catch(e){}
  if(!aS.value)aS.value='blue';if(!mS.value)mS.value='system';
  function apply(){
   if(mS.value==='system')d.removeAttribute('data-theme');else d.setAttribute('data-theme',mS.value);
   d.setAttribute('data-accent',aS.value);
   try{localStorage.setItem('gmm-mode',mS.value);localStorage.setItem('gmm-accent',aS.value)}catch(e){}
   syncBars();
  }
  mS.addEventListener('change',apply);aS.addEventListener('change',apply);apply();
 })();

 }
