:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --h:262;--bg:oklch(.965 .014 var(--h));--panel:oklch(.995 .004 var(--h));--ink:oklch(.22 .03 var(--h));--muted:oklch(.5 .04 var(--h));
 --line:oklch(.88 .02 var(--h));--accent:oklch(.55 .2 var(--h));--on-accent:#fff;--field:oklch(.975 .01 var(--h))}
:root[data-accent="blue"]{--h:262}
:root[data-accent="violet"]{--h:295}
:root[data-accent="teal"]{--h:190}
:root[data-accent="green"]{--h:150}
:root[data-accent="orange"]{--h:55}
:root[data-accent="pink"]{--h:355}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:oklch(.17 .035 var(--h));--panel:oklch(.22 .04 var(--h));--ink:oklch(.95 .01 var(--h));--muted:oklch(.72 .04 var(--h));--line:oklch(.32 .05 var(--h));--accent:oklch(.72 .16 var(--h));--on-accent:oklch(.18 .04 var(--h));--field:oklch(.19 .035 var(--h))}}
:root[data-theme="dark"]{--bg:oklch(.17 .035 var(--h));--panel:oklch(.22 .04 var(--h));--ink:oklch(.95 .01 var(--h));--muted:oklch(.72 .04 var(--h));--line:oklch(.32 .05 var(--h));--accent:oklch(.72 .16 var(--h));--on-accent:oklch(.18 .04 var(--h));--field:oklch(.19 .035 var(--h))}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
.sb{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:oklch(.22 .05 var(--h));z-index:50;pointer-events:none}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Space Grotesk","Helvetica Neue",Arial,sans-serif;line-height:1.45}
main{max-width:1100px;margin:0 auto;padding:18px 14px 36px;display:grid;gap:16px;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);align-items:start}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr)}}
h1{grid-column:1/-1;margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(30px,6vw,52px);letter-spacing:.01em;line-height:1.05}
.stage,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
canvas{display:block;width:100%;height:auto;border-radius:8px;background:#000;touch-action:none;cursor:grab;user-select:none}
canvas.drag{cursor:grabbing}
.hint,.status{color:var(--muted);font-size:13px;margin:8px 2px 0}
.status{min-height:1.3em}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{font:inherit;font-weight:700;border-radius:9px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:9px 13px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{display:grid;gap:14px}
label{display:grid;gap:5px;font-size:14px;font-weight:700}
label small{font-weight:500;color:var(--muted)}
textarea,select,input[type=file]{font:inherit;width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
textarea{min-height:76px;resize:vertical;font-size:18px;font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:100%;height:38px;padding:2px;border-radius:9px;border:1px solid var(--line);background:var(--field)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:5px 10px;font-size:13px}
.check{display:flex;align-items:center;gap:8px}
.theme{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:14px;font-weight:700}
.theme label{display:flex;align-items:center;gap:8px}
.theme select{width:auto;padding:6px 10px}
fieldset{min-width:0;margin:0;border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:12px}
legend{font-weight:700;padding:0 6px}
.gifopts{align-items:center}
.gifopts label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.gifopts select{width:auto;padding:6px 10px}
</style>
</head>
<body>
<div class="sb" aria-hidden="true"></div>
<main>
<h1>Potential-Man</h1>
<div class="theme" aria-label="Appearance">
 <label>Mode <select id="mode"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
 <label>Color <select id="accent"><option value="blue">Blue</option><option value="violet">Violet</option><option value="teal">Teal</option><option value="green">Green</option><option value="orange">Orange</option><option value="pink">Pink</option></select></label>
</div>
<section class="stage" aria-label="Preview">
 <canvas id="cv" width="1024" height="741" role="img" aria-label="Meme preview"></canvas>
 <p class="hint">Drag the text to move it.</p>
 <div class="row">
  <button class="primary" id="save">Save PNG</button>
  <button id="gif">Save GIF</button>
  <button class="primary" id="shareNow" hidden>Share GIF</button>
  <button id="copy">Copy image</button>
  <button id="center">Reset position</button>
 </div>
 <div class="row gifopts">
  <label><input type="checkbox" id="pulse" checked> Pulse the glow in the GIF</label>
  <label>GIF width <select id="gifW"><option value="320">320 px</option><option value="480" selected>480 px</option><option value="640">640 px</option></select></label>
 </div>
 <p class="status" id="status" role="status"></p>
</section>
<section class="panel" aria-label="Controls">
 <fieldset>
  <legend>Text</legend>
  <label>Text <small>One line per row</small><textarea id="txt">DID YOU SAY
POTENTIAL</textarea></label>
  <div class="chips" id="chips">
   <button type="button" data-t="DID YOU SAY&#10;POTENTIAL">Did you say potential</button>
   <button type="button" data-t="YES HE DID">Yes he did</button>
   <button type="button" data-t="SON😭">Son 😭</button>
  </div>
  <label>Font
   <select id="font">
    <option value="tiktok" selected>TikTok Sans</option>
    <option value="inter">Inter</option>
    <option value="rubik">Rubik bold</option>
    <option value="anton">Anton</option>
    <option value="bebas">Bebas Neue</option>
    <option value="grotesk">Space Grotesk bold</option>
    <option value="fedra">Fedra Arabic (Persian)</option>
   </select>
  </label>
  <label>Alignment
   <select id="align"><option value="left" selected>Left</option><option value="center">Center</option><option value="right">Right</option></select>
  </label>
  <label>Size <input type="range" id="size" min="3" max="24" step=".5" value="11"></label>
  <label>Line spacing <input type="range" id="lh" min="80" max="160" step="5" value="120"></label>
  <label>Word spacing <input type="range" id="ws" min="-20" max="100" step="1" value="0"></label>
  <label class="check"><input type="checkbox" id="small" checked> Shrink the lines above the last one</label>
  <label class="check"><input type="checkbox" id="upper" checked> Uppercase</label>
  <label class="check"><input type="checkbox" id="rtl"> Right-to-left text <small>Persian, Arabic, Hebrew</small></label>
 </fieldset>
 <fieldset>
  <legend>Color and glow</legend>
  <div class="two">
   <label>Text color <input type="color" id="c1" value="#73b5ff"></label>
   <label>Glow and outline color <input type="color" id="c2" value="#0033ff"></label>
  </div>
  <label>Glow strength <input type="range" id="glow" min="0" max="200" step="5" value="100"></label>
  <label class="check"><input type="checkbox" id="grad" checked> Soft gradient, lighter at the top</label>
 </fieldset>
 <fieldset>
  <legend>Outline</legend>
  <label>Width <input type="range" id="stroke" min="0" max="20" step="1" value="0"></label>
  <label>Position
   <select id="opos"><option value="out">Outward</option><option value="center">Center</option><option value="in">Inner</option></select>
  </label>
 </fieldset>
 <fieldset>
  <legend>Image</legend>
  <label>Background image <small>Stays on your device</small><input type="file" id="bgFile" accept="image/*"></label>
  <button type="button" id="bgReset">Use the default image</button>
  <label class="check"><input type="checkbox" id="fh"> Flip horizontally <small>Text moves to the other side</small></label>
  <label class="check"><input type="checkbox" id="fv"> Flip vertically</label>
 </fieldset>
 <button type="button" id="reset">Reset all settings</button>
</section>
</main>

 $('gif').addEventListener('click',async function(){

    for(var i=0;i<d.length;i+=8)hist[((d[i]>>3)<<10)|((d[i+1]>>3)<<5)|(d[i+2]>>3)]++;

  }catch(e){glowScale=1;draw();say('Could not make the GIF. Try a smaller width.')}
